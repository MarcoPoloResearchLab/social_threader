name: Browser Test Suite

on:
  push:
    branches:
      - master
    paths:
      - "**/*.js"
      - "**/*.css"
      - "**/*.html"
      - "assets/img/**"
      - "data/**"
      - ".nojekyll"
      - CNAME
      - Makefile
      - robots.txt
      - sitemap.xml
      - "scripts/release/**"
      - "tests/**/*.py"
      - mobile/app.json
      - mobile/eas.json
      - mobile/scripts/**
      - package.json
      - package-lock.json
      - mobile/package.json
      - mobile/package-lock.json
      - .github/workflows/browser-tests.yml
  pull_request:
    branches:
      - master
    paths:
      - "**/*.js"
      - "**/*.css"
      - "**/*.html"
      - "assets/img/**"
      - "data/**"
      - ".nojekyll"
      - CNAME
      - Makefile
      - robots.txt
      - sitemap.xml
      - "scripts/release/**"
      - "tests/**/*.py"
      - mobile/app.json
      - mobile/eas.json
      - mobile/scripts/**
      - package.json
      - package-lock.json
      - mobile/package.json
      - mobile/package-lock.json
      - .github/workflows/browser-tests.yml

jobs:
  run-browser-tests:
    name: Run browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore Puppeteer browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Install Chrome for Puppeteer
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Happy DOM harness
        run: npm run test:headless

      - name: Run Puppeteer browser suite
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:browser

      - name: Run Pages release pipeline tests
        run: python3 tests/test_pages_release_pipeline.py

  run-mobile-checks:
    name: Run mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile coverage and config checks
        working-directory: mobile
        run: npm run check
