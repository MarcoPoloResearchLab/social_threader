name: Social Threader CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-api-and-container:
    name: Browser, API, and container checks
    runs-on: [self-hosted, linux, x64, computercat-ci]
    timeout-minutes: 30
    env:
      CI: "true"
      PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Restore Puppeteer browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}

      - name: Install browser dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Go and Happy DOM checks
        run: make go-mod-verify lint go-test browser-test
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Validate and build container contracts
        run: |
          make local-config LOCAL_ENV_FILE=.env.example
          make test-local-tauth-fixture
          make container-check

      - name: Start the local black-box stack
        run: make local-up LOCAL_ENV_FILE=.env.example

      - name: Verify the TAuth and fake-proxy lifecycle
        run: make local-smoke

      - name: Record the local black-box stack diagnostics
        if: always()
        run: |
          export SOCIAL_THREADER_ENV_FILE=.env.example
          export SOCIAL_THREADER_TAUTH_FIXTURE_DIR="$PWD/.cache/local-tauth/prepared"
          docker compose --env-file .env.example ps --all
          docker compose --env-file .env.example logs --no-color
          docker image inspect ghcr.io/tyemirov/tauth:2.2.23 --format '{{json .RepoDigests}}'

      - name: Stop the local black-box stack
        if: always()
        run: make local-down LOCAL_ENV_FILE=.env.example

  mobile:
    name: Mobile checks
    runs-on: [self-hosted, linux, x64, computercat-ci]
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile coverage and config checks
        working-directory: mobile
        run: npm run check
