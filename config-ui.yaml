# Browser-facing mpr-ui authentication configuration.
environments:
  - description: "Social Threader Local"
    origins:
      - "http://localhost:4173"
    auth:
      tauthUrl: ""
      tenantId: "social-threader"
      logoutPath: "/auth/logout"
      sessionPath: "/auth/session"
      providers:
        google:
          enabled: true
          clientId: "991677581607-r0dj8q6irjagipali0jpca7nfp8sfj9r.apps.googleusercontent.com"
          loginPath: "/auth/google"
          noncePath: "/auth/nonce"
        apple:
          enabled: false
        password:
          enabled: false

  - description: "Social Threader Hosted"
    origins:
      - "https://threader.mprlab.com"
    auth:
      tauthUrl: "https://tauth-api.mprlab.com"
      tenantId: "social-threader"
      logoutPath: "/auth/logout"
      sessionPath: "/auth/session"
      providers:
        google:
          enabled: true
          clientId: "991677581607-r0dj8q6irjagipali0jpca7nfp8sfj9r.apps.googleusercontent.com"
          loginPath: "/auth/google"
          noncePath: "/auth/nonce"
        apple:
          enabled: false
        password:
          enabled: false
