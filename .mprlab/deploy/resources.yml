mprlab_resources:
    artifacts:
        container_images:
            - build:
                arguments:
                    - identity: release_version
                      name: RELEASE_VERSION
                context: .
                dockerfile: Dockerfile
                platforms:
                    - linux/amd64
                    - linux/arm64
                target: api
              id: api-image
        mobile:
            - android:
                package_name: com.mprlab.socialthreader
              build:
                android: mobile/scripts/build-android-bundle.mjs
                ios: mobile/scripts/build-ios.mjs
              build_system: local
              id: mobile
              ios:
                bundle_identifier: com.mprlab.threader
                export_intent: app-store
              source: mobile
        web_bundles:
            - format: directory
              id: website
              source:
                context: .
                dockerfile: Dockerfile
                kind: container
                target: pages
    environment:
        private_inputs:
            - id: app-store-connect-api-issuer-id
              variable: APP_STORE_CONNECT_API_ISSUER_ID
            - id: app-store-connect-api-key-id
              variable: APP_STORE_CONNECT_API_KEY_ID
            - id: app-store-connect-api-key-path
              variable: APP_STORE_CONNECT_API_KEY_PATH
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: google-play-service-account-key-path
              variable: GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_PATH
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
            - id: social-threader-android-keystore-properties
              variable: SOCIAL_THREADER_ANDROID_KEYSTORE_PROPERTIES
            - id: social-threader-apple-team-id
              variable: SOCIAL_THREADER_APPLE_TEAM_ID
            - id: social-threader-google-web-client-id
              variable: SOCIAL_THREADER_GOOGLE_WEB_CLIENT_ID
            - id: social-threader-ios-certificate-base64
              variable: SOCIAL_THREADER_IOS_CERTIFICATE_BASE64
            - id: social-threader-ios-certificate-password
              variable: SOCIAL_THREADER_IOS_CERTIFICATE_PASSWORD
            - id: social-threader-ios-provisioning-profile
              variable: SOCIAL_THREADER_IOS_PROVISIONING_PROFILE
            - id: social-threader-ios-signing-identity
              variable: SOCIAL_THREADER_IOS_SIGNING_IDENTITY
            - id: social-threader-llm-proxy-secret
              variable: SOCIAL_THREADER_LLM_PROXY_SECRET
            - id: social-threader-tauth-jwt-signing-key
              variable: SOCIAL_THREADER_TAUTH_JWT_SIGNING_KEY
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 5m
                request: 30s
                shutdown: 30s
                startup: 2m
        observations:
            http:
                - expected_status: 200
                  id: public-health
                  protocol: http
                  url: https://threader-api.mprlab.com/healthz
                - expected_status: 200
                  id: website-health
                  protocol: http
                  url: https://threader.mprlab.com/healthz
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 20m
            - name: app-plan-deploy
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-plan-publish
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-plan-release
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-publish
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 4h
            - name: app-release
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2h
            - name: app_lifecycle.repository_read
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
            - name: ci
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2h
        private_inputs:
            operations: []
    owner: social-threader
    publications:
        app_store_connect:
            ios:
                - app_store_id: "6788578080"
                  artifact:
                    id: mobile
                    platform: ios
                  destination: app_store
                  id: mobile-ios
                  track: production
        ghcr:
            images:
                - artifact: api-image
                  id: api-image
                  repository: ghcr.io/marcopoloresearchlab/social_threader
        github_pages:
            sites:
                - artifact: website
                  branch: gh-pages
                  domain: threader.mprlab.com
                  id: website
                  marker:
                    path: /.mprlab-release.json
                  repository: marcopoloresearchlab/social_threader
        google_play:
            applications:
                - artifact:
                    id: mobile
                    platform: android
                  destination: google_play
                  id: mobile-android
                  track: production
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: runtime
                  services:
                    - assets:
                        - mode: "0444"
                          source: configs/config.yml
                          target: /app/configs/config.yml
                      endpoints:
                        - endpoint:
                            alias: social-threader-api
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: http
                          name: social-threader.http
                          version: 1
                        - endpoint:
                            alias: runtime-social-threader-api-readiness
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: readiness
                          name: social-threader.readiness.runtime.social-threader-api
                          version: 1
                      environment:
                        - capability: llm-proxy.http
                          component: url
                          name: LLM_PROXY_BASE_URL
                        - input: social-threader-llm-proxy-secret
                          name: LLM_PROXY_SECRET
                        - name: SOCIAL_THREADER_PROFILE
                          value: hosted
                        - input: social-threader-tauth-jwt-signing-key
                          name: TAUTH_JWT_SIGNING_KEY
                      id: social-threader-api
                      image:
                        publication: api-image
                      placement:
                        cardinality: one
                        group: gateway
                      ports:
                        - container_port: 8080
                      readiness:
                        endpoint: readiness
        github_pages:
            sites:
                - id: website
                  publication: website
                  url: https://threader.mprlab.com/
        ingress:
            caddy:
                routes:
                    - access:
                        rate_limit:
                            events: 30
                            window_seconds: 10
                      handlers:
                        - id: default
                          path_prefix: /
                          transport:
                            dial_timeout_seconds: 10
                            protocol: http
                            read_timeout_seconds: 180
                            response_header_timeout_seconds: 180
                          upstream: social-threader.http
                      hostname: threader-api.mprlab.com
                      id: public-api
                      listener: https
                      tls:
                        mode: automatic
